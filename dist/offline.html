<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#064e3b" />
  <title>অফলাইন — কৃষি AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: #f0f4f0;
      color: #111827;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: #1b4332; margin-bottom: 8px; }
    p { font-size: 14px; color: #6b7280; max-width: 300px; line-height: 1.6; }
    .retry-btn {
      margin-top: 24px;
      padding: 12px 28px;
      background: #1b8a3e;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .retry-btn:hover { background: #166534; }
  </style>
</head>
<body>
  <div class="icon">🌾</div>
  <h1>ইন্টারনেট সংযোগ নেই</h1>
  <p>আপনি বর্তমানে অফলাইনে আছেন। অনুগ্রহ করে সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।</p>
  <button class="retry-btn" onclick="window.location.reload()">আবার চেষ্টা করুন</button>
</body>
</html>
