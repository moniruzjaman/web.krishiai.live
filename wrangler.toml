name = "krishiai-api-gateway"
main = "src/workers/api-gateway.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Note: custom hostname mapping should be done in Cloudflare Dashboard:
# Workers & Pages > krishiai-api-gateway > Settings > Domains & Routes > Add custom domain:
#   web.krishiai.live/api/*
# Do NOT use `route` here on Free plan because it requires an active zone owned by the account.

# Wrangler supports .dev.vars for local secrets (gitignored by default)
# KV and other bindings are commented out as optional upgrades

# Uncomment below when ready to enable durable caching
# [[kv_namespaces]]
# binding = "GATEWAY_CACHE"
# id = "cd1a6bXXXXXXXXXX"
# preview_id = "cd1a6bXXXXXXXXXX"