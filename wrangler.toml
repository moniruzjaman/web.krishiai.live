# ── Cloudflare Workers — KrishiAI Edge AI Gateway ─────────────────────────────
#
# Deploys a lightweight Worker on CF's edge that calls Workers AI natively.
# This is FASTER than the REST API path from Vercel because:
#   1. No HTTP round-trip to CF API — AI binding is in-process
#   2. Runs on CF's edge (sub-10ms cold start)
#   3. No Bearer token needed — binding auth is implicit
#
# Deploy:  wrangler deploy
# Dev:     wrangler dev
# ──────────────────────────────────────────────────────────────────────────────

name = "web.krishiai.live"
main = "src/workers/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = []

# ── Workers AI Binding ────────────────────────────────────────────────────────
# Grants the Worker native access to CF Workers AI models without REST + Bearer.
[ai]
binding = "AI"

# ── Routes ────────────────────────────────────────────────────────────────────
# The Worker will be accessible at api.krishiai.live
# (route must be configured in CF dashboard after first deploy)
# [[routes]]
# pattern = "api.krishiai.live/*"
# zone_name = "krishiai.live"

# ── Environment Variables ─────────────────────────────────────────────────────
# Non-secret config (secrets go via `wrangler secret put`)
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://web.krishiai.live"
DEFAULT_MODEL = "@cf/meta/llama-3-8b-instruct"

# ── Limits ────────────────────────────────────────────────────────────────────
[limits]
cpu_ms = 5000

# ── Build ─────────────────────────────────────────────────────────────────────
# Wrangler bundles the worker entry point automatically.
# No external build step needed — TypeScript is compiled by wrangler.
