name = "webkrishiailive"
# Entry point — middleware (CORS, rate-limit) is inlined directly into this file
# so wrangler/esbuild can bundle it without relative import issues.
main = "src/workers/api-gateway.ts"
route = { pattern = "api.krishiai.live/*", zone_name = "krishiai.live" }
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Wrangler supports .dev.vars for local secrets (gitignored by default)

# Uncomment below when ready to enable durable caching
# [[kv_namespaces]]
# binding = "KV"
# id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"
