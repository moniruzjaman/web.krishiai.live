name: CI + Verify

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run validate:env

  verify:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment to go live
        run: |
          echo "Polling https://krishiai.live/ ..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://krishiai.live/)
            if [ "$code" = "200" ]; then
              echo "✅ Live after $((i * 15))s"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Deployment not live after 5 minutes"
          exit 1

      - name: Verify API health
        run: |
          curl -sf https://krishiai.live/api/analyze > /dev/null
          echo "✅ /api/analyze"

      - name: Verify SPA routes
        run: |
          for path in / /chat /analyzer /tools /learn /profile; do
            curl -sf "https://krishiai.live$path" > /dev/null
            echo "✅ $path"
          done

      - name: Verify HTML content
        run: |
          html=$(curl -sf https://krishiai.live/)
          echo "$html" | grep -q "কৃষি AI" && echo "✅ Title present"
          echo "$html" | grep -q 'type="module"' && echo "✅ Module script present"

      - name: Verify SW Cache-Control header
        run: |
          headers=$(curl -sI https://krishiai.live/sw.js)
          echo "$headers" | grep -q "max-age=0, must-revalidate"
          echo "✅ SW header correct"

      - name: Verify proxy endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://krishiai.live/api/proxy?target=https://api.open-meteo.com/v1/forecast&latitude=23.8&longitude=90.4&current=temperature_2m&forecast_days=1")
          echo "✅ Proxy: HTTP $code"
