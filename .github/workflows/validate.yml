name: KrishiAI — Validate

on:
  push:
    branches: [main, production, production-v2, v3.0.0, v4.0]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Newspaper HTML extractor tests
        run: python3 scripts/test_bd_agri_news_extractor.py
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
