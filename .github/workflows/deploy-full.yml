name: KrishiAI — Validate & Deploy CF Gateway

on:
  push:
    branches: [main, production, production-v2]
  pull_request:
    branches: [main]

jobs:
  # ── Validate: Build test + Worker config check ──────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Build Next.js (standalone)
        run: bun run build

      - name: Validate Cloudflare Worker config
        run: |
          test -f wrangler.toml || { echo "❌ wrangler.toml not found"; exit 1; }
          test -f src/workers/index.ts || { echo "❌ Worker entry point not found"; exit 1; }
          echo "✅ Cloudflare Worker config and entry point are present"

      - name: Type-check Cloudflare Worker
        run: bun x tsc --noEmit --project tsconfig.worker.json

  # ── Deploy: CF Workers AI Gateway ──────────────────────────────────────────
  deploy-cloudflare-gateway:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun x wrangler deploy

      - name: Gateway Deployment Summary
        run: |
          echo "✅ KrishiAI Edge AI Gateway deployed successfully"
          echo "Endpoint: https://webkrishiailive.${{ vars.CF_ACCOUNT_ID }}.workers.dev"
          echo "Custom domain: https://api.krishiai.live (if route configured)"
