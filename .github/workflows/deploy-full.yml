name: KrishiAI — Validate & Deploy Cloudflare Gateway

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Validate Cloudflare Worker config
        run: |
          test -f wrangler.toml || { echo "wrangler.toml not found"; exit 1; }
          echo "Cloudflare Worker config is present"

  deploy-cloudflare-gateway:
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Publish Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler deploy --token=$CLOUDFLARE_API_TOKEN

      - name: Gateway Deployment Summary
        run: |
          echo "Cloudflare API Gateway deployed successfully"
          echo "https://api.krishiai.live"
